<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{fragments/layout :: head('Editar usuario')}"></head>
  <body>
    <div th:replace="~{fragments/layout :: nav}"></div>
    <main class="container-xl py-4 py-lg-5" id="contenido">
      <div th:replace="~{fragments/layout :: mensajes}"></div>

      <div class="page-heading">
        <div>
          <p class="eyebrow">ADMINISTRACIÓN / ACCESOS</p>
          <h1 th:text="${id == null ? 'Crear usuario' : 'Editar usuario'}"></h1>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/admin/usuarios}"
          >Volver a usuarios</a
        >
      </div>
      <form
        class="form-panel form-narrow"
        th:action="${id == null} ? @{/admin/usuarios} : @{/admin/usuarios/{id}(id=${id})}"
        th:object="${form}"
        method="post"
      >
        <div th:replace="~{fragments/layout :: errores}"></div>
        <label for="username" class="form-label">Nombre de usuario *</label
        ><input
          id="username"
          th:field="*{username}"
          class="form-control"
          autocomplete="off"
          pattern="[a-zA-Z0-9._\-]{3,60}"
          required
          maxlength="60"
        /><label for="password" class="form-label mt-4"
          >Contraseña <span th:if="${id == null}">*</span></label
        ><input
          id="password"
          name="password"
          type="password"
          class="form-control"
          autocomplete="new-password"
          minlength="10"
          maxlength="72"
          th:required="${id == null}"
        />
        <p class="form-text">
          Al menos 10 caracteres y hasta 72 bytes UTF-8. Al editar, déjela vacía
          para conservar la actual.
        </p>
        <label for="rol" class="form-label mt-3">Rol *</label
        ><select id="rol" th:field="*{rol}" class="form-select" required>
          <option
            th:each="r : ${roles}"
            th:value="${r}"
            th:text="${r.name() == 'ADMIN' ? 'Administrador' : 'Bodeguero'}"
          ></option></select
        ><label class="form-check mt-4"
          ><input
            type="checkbox"
            class="form-check-input"
            th:field="*{estado}"
          /><span class="form-check-label">Cuenta activa</span></label
        >
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Guardar usuario</button
          ><a class="btn btn-outline-secondary" th:href="@{/admin/usuarios}"
            >Cancelar</a
          >
        </div>
      </form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
